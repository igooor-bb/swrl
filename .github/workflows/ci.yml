name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install locked developer tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.7.13
          install: true
          install_args: --locked
          cache: true

      - name: Run project checks
        run: mise run check
