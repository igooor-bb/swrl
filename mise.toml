min_version = "2026.7.13"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "macos-x64"]

[tools]
swiftformat = { version = "0.62.1", no_app = true }
swiftlint = "0.63.2"

[tasks.doctor]
description = "Verify the active Xcode and Swift toolchain"
run = '''
set -eu

swift_version="$(swift --version)"
swift_major="$(printf '%s\n' "$swift_version" | sed -n 's/.*Swift version \([0-9][0-9]*\)\.[0-9][0-9]*.*/\1/p' | head -n 1)"
if [ -z "$swift_major" ]; then
  echo "Unable to determine the active Swift version from: $swift_version" >&2
  exit 1
fi

if [ "$swift_major" -lt 6 ]; then
  echo "Expected Swift 6.0 or newer from the active Xcode, but found: $swift_version" >&2
  exit 1
fi

developer_dir="${DEVELOPER_DIR:-}"
if [ -z "$developer_dir" ]; then
  developer_dir="$(xcode-select -p)"
fi

if [ ! -x "$developer_dir/usr/bin/xcodebuild" ]; then
  echo "xcodebuild was not found under $developer_dir" >&2
  exit 1
fi

index_store_library="$developer_dir/Toolchains/XcodeDefault.xctoolchain/usr/lib/libIndexStore.dylib"
if [ ! -f "$index_store_library" ]; then
  echo "libIndexStore was not found at $index_store_library" >&2
  exit 1
fi

echo "Toolchain ready: $developer_dir"
'''

[tasks.format]
description = "Format Swift sources"
run = "swiftformat --cache ignore Package.swift Sources Tests"

[tasks."format:check"]
description = "Check Swift source formatting"
run = "swiftformat --lint --cache ignore Package.swift Sources Tests"

[tasks.lint]
description = "Run strict SwiftLint checks"
run = "swiftlint lint --strict --no-cache --config .swiftlint.yml"

[tasks.test]
description = "Run the test suite"
run = "swift test"

[tasks.build]
description = "Build the release executable"
run = "swift build -c release"

[tasks.check]
description = "Run all project checks in order"
run = '''
set -eu
mise run doctor
mise run format:check
mise run lint
mise run test
mise run build
'''

[tasks.clean]
description = "Remove SwiftPM build artifacts"
run = "swift package clean"

[tasks.install]
description = "Install swrl into SWRL_INSTALL_DIR (default: ~/.local/bin)"
depends = ["build"]
run = '''
set -eu
install_dir="${SWRL_INSTALL_DIR:-$HOME/.local/bin}"
install -d "$install_dir"
install ".build/release/swrl" "$install_dir/swrl"
echo "Installed swrl to $install_dir/swrl"
'''

[tasks.uninstall]
description = "Remove swrl from SWRL_INSTALL_DIR (default: ~/.local/bin)"
run = '''
set -eu
install_dir="${SWRL_INSTALL_DIR:-$HOME/.local/bin}"
rm -f "$install_dir/swrl"
echo "Uninstalled swrl from $install_dir/swrl"
'''
